# Render Blueprint — https://render.com/docs/blueprint-spec

services:
  - type: web
    name: telegram-forwarder
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 app.web_server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RUN_BOT
        value: "true"
      - key: FLASK_SECRET_KEY
        generateValue: true
